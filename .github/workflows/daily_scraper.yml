name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  schedule:
    # Horaire de production : 15h30 UTC, volontairement décalé de l'heure
    # pile pour éviter la zone de forte charge/retard documentée par GitHub
    # sur les déclenchements schedule proches de hh:00.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [daily, backfill]
        default: daily
      days_back:
        description: "Nombre de jours à remonter (surtout pertinent en mode backfill)"
        type: string
        default: "7"
      group_limit:
        description: "Nombre max de groupes traités sur ce run (0 = tous les groupes actifs)"
        type: string
        default: "0"
      batch_size:
        description: "Taille des lots de groupes entre deux pauses longues anti-détection"
        type: string
        default: "5"

permissions:
  contents: read

# Un seul run actif à la fois : deux scrapes concurrents sur la même session
# Facebook (mêmes cookies) multiplieraient le risque de détection anti-bot.
concurrency:
  group: ouaga-foncier-etl
  cancel-in-progress: false

jobs:
  # Job séparé et bloquant : si la suite de tests échoue (régression sur les
  # regex, le parseur d'horodatage, le throttle adaptatif, etc.), le job de
  # scraping ne démarre même pas.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          # Version majeure.mineure seulement (et non 3.12.7) : setup-python
          # résout automatiquement le dernier patch disponible, ce qui évite
          # un échec si le patch exact 3.12.7 disparaît du manifeste GitHub.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "Suite de tests (pytest)"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances Python"
        run: pip install -r requirements.txt

      - name: "Installation de Chromium (Playwright)"
        run: playwright install --with-deps chromium

      # État persistant entre deux runs : storage_state, déduplication des
      # posts déjà vus, cooldown anti-blocage et score de confiance du
      # throttle adaptatif.
      - name: "Restauration de l'état persistant (data/state)"
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: etat-scraper-${{ github.run_id }}
          restore-keys: |
            etat-scraper-

      # Jitter anti-empreinte temporelle : uniquement sur le déclenchement
      # cron, pour éviter que le trafic parte systématiquement à la même
      # seconde chaque jour. Pas de jitter en déclenchement manuel.
      - name: "Délai aléatoire avant démarrage (cron uniquement)"
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))  # 0 à 20 minutes

      - name: "Résolution des paramètres d'exécution"
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "days_back=1" >> "$GITHUB_OUTPUT"
            echo "group_limit=0" >> "$GITHUB_OUTPUT"
            echo "batch_size=5" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "days_back=${{ github.event.inputs.days_back }}" >> "$GITHUB_OUTPUT"
            echo "group_limit=${{ github.event.inputs.group_limit }}" >> "$GITHUB_OUTPUT"
            echo "batch_size=${{ github.event.inputs.batch_size }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Exécution du pipeline ETL"
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Base maître PostgreSQL hébergée sur Neon (tier gratuit) - voir
          # README.md, section "Base de données".
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py \
            --mode "${{ steps.params.outputs.mode }}" \
            --days-back "${{ steps.params.outputs.days_back }}" \
            --group-limit "${{ steps.params.outputs.group_limit }}" \
            --batch-size "${{ steps.params.outputs.batch_size }}"

      # Installe un pg_dump compatible avec la version serveur de Neon.
      - name: "Installer pg_dump compatible avec la version PostgreSQL de Neon"
        if: always()
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # Sauvegarde ponctuelle de la base maître dans l'artefact du run.
      - name: "Sauvegarde SQL de la base maître (pg_dump)"
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PG_DUMP_BIN="/usr/lib/postgresql/18/bin/pg_dump"
          if [ ! -x "$PG_DUMP_BIN" ]; then
            echo "::warning::$PG_DUMP_BIN introuvable, repli sur 'pg_dump' générique (risque de mismatch de version serveur)"
            PG_DUMP_BIN="pg_dump"
          fi
          "$PG_DUMP_BIN" --version
          "$PG_DUMP_BIN" "$DATABASE_URL" --no-owner --no-privileges -f data/processed/annonces_backup.sql || true

      - name: "Upload de l'artefact (dump base maître, Excel, CSV du run, logs)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "annonces-foncieres-${{ github.run_id }}"
          path: |
            data/processed/annonces_backup.sql
            data/processed/annonces.xlsx
            data/processed/annonces_*.csv
            data/processed/rejetes_*.json
            data/logs/*.log
            data/logs/debug_page_vide_*.html
          retention-days: 30
          if-no-files-found: warn

      - name: "Sauvegarde de l'état persistant pour le prochain run"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: etat-scraper-${{ github.run_id }}
